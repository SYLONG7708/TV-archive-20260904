        padding: 8px 12px;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.36), transparent);
      }

      #playerSheet.is-player-fullscreen video,
      #playerSheet.is-player-fullscreen .player-frame {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        object-fit: contain;
      }

      html.long-tv-car {
        scroll-behavior: auto;
      }

      html.long-tv-car body {
        background: var(--bg);
        overscroll-behavior: none;
        touch-action: pan-y;
      }

      html.long-tv-car .app {
        width: 100%;
        max-width: 1920px;
        padding: 8px 16px 28px;
      }

      html.long-tv-uis7870-129 .app {
        padding-right: 100px;
      }

      html.long-tv-uis7870-129 .nav-overlay-spacer {
        display: block;
        flex-basis: 82px;
      }

      html.long-tv-uis7870-129 .floating-filter {
        right: 34px;
      }

      html.long-tv-car .top-nav {
        min-height: 58px;
        gap: 10px;
        padding: 4px 0 8px;
        background: var(--bg);
        contain: layout paint;
        transform: translateZ(0);
        scroll-snap-type: x proximity;
      }

      html.long-tv-car .nav-btn {
        min-height: 44px;
        padding: 0 13px;
        font-size: 1.1rem;
        scroll-snap-align: center;
      }

      html.long-tv-car .nav-btn.is-active {
        padding: 0 20px;
      }

      html.long-tv-car .nav-source-btn {
        width: 46px;
        height: 46px;
        border-radius: 13px;
      }

      html.long-tv-car .toolbar {
        margin-bottom: 7px;
      }

      html.long-tv-car .quick-filters {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        margin-bottom: 8px;
        padding-bottom: 2px;
        scrollbar-width: none;
        scroll-snap-type: x proximity;
      }

      html.long-tv-car .quick-filter-block,
      html.long-tv-car .quick-filter-row {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        overflow: visible;
        margin: 0;
      }

      html.long-tv-car .quick-filter-block {
        padding-right: 5px;
        border-right: 1px solid var(--line);
        scroll-snap-align: start;
      }

      html.long-tv-car .quick-filter-label {
        margin: 0;
        color: var(--cyan);
      }

      html.long-tv-car .chip {
        min-height: 38px;
        padding: 0 13px;
      }

      html.long-tv-car .signal-strip {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: 2px 0 6px;
        scrollbar-width: none;
        scroll-snap-type: x proximity;
      }

      html.long-tv-car .signal-strip::-webkit-scrollbar {
        display: none;
      }

      html.long-tv-car .signal-chip {
        flex: 0 0 auto;
        max-width: 220px;
        min-height: 44px;
        scroll-snap-align: start;
      }

      html.long-tv-car .detail-copy p {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      html.long-tv-car .poster-grid {
        gap: 14px 12px;
      }

      html.long-tv-car .poster-card,
      html.long-tv-car button,
      html.long-tv-car input {
        -webkit-tap-highlight-color: transparent;
      }

      html.long-tv-car button:focus,
      html.long-tv-car input:focus {
        outline: 3px solid rgba(50, 214, 231, 0.9);
        outline-offset: 2px;
      }

      html.long-tv-car .sheet-panel {
        width: min(94vw, 1080px);
        max-height: 92vh;
      }

      @media (min-width: 760px) {
        html.long-tv-car .poster-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (min-width: 960px) {
        html.long-tv-car .poster-grid {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }

      @media (min-width: 1180px) {
        html.long-tv-car .poster-grid {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }
      }

      @media (min-width: 1500px) {
        html.long-tv-car .poster-grid {
          grid-template-columns: repeat(8, minmax(0, 1fr));
        }
      }

      @media (min-width: 620px) {
        .poster-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .episode-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      @media (min-width: 980px) {
        .poster-grid {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }

        .app {
          padding-inline: 28px;
        }

        .sheet-panel {
          width: min(92vw, 900px);
        }

        #playerSheet .sheet-panel {
          width: min(94vw, 1280px);
        }
      }

      @media (max-width: 430px) {
        .top-nav {
          gap: 12px;
        }

        .hero {
          min-height: 36vh;
          grid-template-columns: minmax(0, 1fr) 124px;
        }

        .poster-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .toolbar {
          grid-template-columns: minmax(0, 1fr) 42px;
        }

        .text-icon-btn span {
          display: none;
        }

        .episode-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .episode-toolbar {
          align-items: stretch;
          flex-direction: column;
        }
      }

      @media (max-width: 360px) {
        .app {
          padding-inline: 8px;
        }

        .nav-btn {
          font-size: 1rem;
        }

        .nav-source-btn {
          width: 46px;
          height: 46px;
        }
      }

      @media (orientation: landscape) and (max-height: 540px) {
        #playerSheet .sheet-panel {
          height: 100vh;
          height: 100dvh;
          max-height: 100vh;
          max-height: 100dvh;
          border-radius: 0;
          border: 0;
        }

        #playerSheet .sheet-body {
          display: grid;
          align-items: center;
        }

        #playerSheet video,
        #playerSheet .player-frame {
          max-height: calc(100vh - 74px);
          max-height: calc(100dvh - 74px);
          aspect-ratio: auto;
        }

        html.long-tv-car .app {
          padding-top: 4px;
        }

        html.long-tv-car .top-nav {
          min-height: 52px;
        }

        html.long-tv-car .section-head {
          margin-top: 9px;
        }
      }

      @supports not (display: grid) {
        .toolbar,
        .sheet-head,
        .detail-grid,
        .row,
        .source-row {
          display: flex;
          align-items: center;
        }

        .toolbar .search,
        .sheet-head > div,
        .detail-copy,
        .row-main {
          min-width: 0;
          flex: 1 1 auto;
        }

        .poster-grid,
        .episode-grid {
          display: flex;
          flex-wrap: wrap;
          margin: -6px;
        }

        .poster-card {
          width: calc(50% - 12px);
          margin: 6px;
        }

        .episode-grid button {
          width: calc(33.333% - 12px);
          margin: 6px;
        }

        .detail-grid {
          align-items: flex-start;
        }

        .detail-grid > .poster-art {
          width: 116px;
          flex: 0 0 116px;
          margin-right: 12px;
        }

        .row > :not(:last-child),
        .source-row > :not(:last-child) {
          margin-right: 10px;
        }

        @media (min-width: 620px) {
          .poster-card {
            width: calc(25% - 12px);
          }

          .episode-grid button {
            width: calc(25% - 12px);
          }
        }

        @media (min-width: 960px) {
          html.long-tv-car .poster-card {
            width: calc(20% - 12px);
          }
        }

        @media (min-width: 1180px) {
          html.long-tv-car .poster-card {
            width: calc(16.666% - 12px);
          }
        }

        @media (min-width: 1500px) {
          html.long-tv-car .poster-card {
            width: calc(12.5% - 12px);
          }
        }
      }

      .load-more-status {
        margin-top: 14px;
      }

      .reset-filter-btn {
        width: 100%;
        margin-top: 10px;
      }
