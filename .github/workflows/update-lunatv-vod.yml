name: Update LunaTV VOD sources

on:
  workflow_dispatch:
  schedule:
    # 02:00 Asia/Shanghai. The job checks the last successful update state
    # and refreshes once per day; failed attempts retry the next day.
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: update-lunatv-vod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check daily update window
        id: gate
        shell: pwsh
        run: |
          $statePath = ".\docs\data\lunatv-vod-update-state.json"
          $intervalDays = 1
          $scheduleHour = 2
          $timeZone = [TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")
          $nowUtc = [DateTimeOffset]::UtcNow
          $shouldRun = $true
          $reason = "manual"

          if ("${{ github.event_name }}" -ne "workflow_dispatch") {
            $reason = "no previous success state"
            if (Test-Path -LiteralPath $statePath) {
              try {
                $state = Get-Content -LiteralPath $statePath -Raw -Encoding UTF8 | ConvertFrom-Json
                if ($state.nextDueAt) {
                  $nextDue = [DateTimeOffset]::Parse([string]$state.nextDueAt)
                } elseif ($state.lastSuccessAt) {
                  $lastSuccess = [DateTimeOffset]::Parse([string]$state.lastSuccessAt)
                  $localSuccess = [TimeZoneInfo]::ConvertTime($lastSuccess, $timeZone)
                  $nextLocal = $localSuccess.Date.AddDays($intervalDays).AddHours($scheduleHour)
                  if ($nextLocal -le $localSuccess.DateTime) { $nextLocal = $nextLocal.AddDays(1) }
                  $nextDue = [DateTimeOffset]::new($nextLocal, $timeZone.GetUtcOffset($nextLocal))
                }

                if ($nextDue -and $nowUtc -lt $nextDue.ToUniversalTime()) {
                  $shouldRun = $false
                  $reason = "next due $($nextDue.ToString("yyyy-MM-dd HH:mm:ss zzz"))"
                } else {
                  $reason = "due"
                }
              } catch {
                $reason = "state unreadable, run update: $($_.Exception.Message)"
              }
            }
          }

          "should_run=$($shouldRun.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reason=$reason" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "should_run=$shouldRun; $reason"

      - name: Seed previous public VOD data
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          git fetch origin gh-pages
          $pages = Join-Path $env:RUNNER_TEMP "gh-pages-seed"
          git worktree add $pages origin/gh-pages
          $items = @(
            @{ From = "docs\data\iphone-vod-catalog.json"; To = "docs\data\iphone-vod-catalog.json"; Directory = $false },
            @{ From = "docs\data\iphone-vod-catalog-report.json"; To = "docs\data\iphone-vod-catalog-report.json"; Directory = $false },
            @{ From = "docs\data\vod-detail"; To = "docs\data\vod-detail"; Directory = $true },
            @{ From = "docs\data\vod-index"; To = "docs\data\vod-index"; Directory = $true }
          )
          foreach ($item in $items) {
            $from = Join-Path $pages $item.From
            $to = Join-Path "." $item.To
            if (-not (Test-Path -LiteralPath $from)) { continue }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $to) | Out-Null
            if ($item.Directory) {
              Copy-Item -LiteralPath $from -Destination (Split-Path -Parent $to) -Recurse -Force
            } else {
              Copy-Item -LiteralPath $from -Destination $to -Force
            }
          }
          git worktree remove $pages --force

      - name: Refresh LunaTV VOD sources
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\update-lunatv-vod.ps1 `
            -SourceName "jin18" `
            -TimeoutSec 12 `
            -MaxDetailProbe 2 `
            -RedactSampleNames
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\update-lunatv-vod.ps1 `
            -SourceName "full" `
            -TimeoutSec 12 `
            -MaxDetailProbe 2 `
            -RedactSampleNames
          node .\tools\build-lunatv-adult18-sorted.mjs --repoRoot .
          node .\tools\build-iphone-vod-catalog.mjs `
            --tvRoot . `
            --output .\docs\data\iphone-vod-catalog.json `
            --reportOutput .\docs\data\iphone-vod-catalog-report.json `
            --maxSources 120 `
            --maxItemsPerSource 70 `
            --maxCategoriesPerSource 8 `
            --includeAdult true `
            --includeLegacySources false `
            --mergeExisting true `
            --timeoutMs 8000
          node .\tools\build-full-vod-chunked-catalog.mjs `
            --tvRoot . `
            --catalog .\docs\data\iphone-vod-catalog.json `
            --report .\docs\data\iphone-vod-catalog-report.json `
            --detailRoot .\docs\data\vod-detail `
            --includeAdult true `
            --pageSize 100 `
            --sourceConcurrency 2 `
            --pageConcurrency 8 `
            --outputPageSize 500 `
            --fetchRetries 3 `
            --timeoutMs 20000 `
            --appendDetailPages true `
            --skipExistingPages true `
            --keepPartialPages true `
            --refreshLeadingPages 2 `
            --maxNewPagesPerSource 100 `
            --maxFailedPages 20 `
            --detailOnly true
          node .\tools\build-type3-spider-catalog.mjs `
            --tvRoot . `
            --catalog .\docs\data\iphone-vod-catalog.json `
            --report .\docs\data\iphone-vod-catalog-report.json `
            --detailRoot .\docs\data\vod-detail `
            --maxPagesPerCategory 0 `
            --maxCategoryPageSafetyLimit 200 `
            --fetchRetries 5 `
            --timeoutMs 30000
          node .\tools\assemble-vod-index-from-detail.mjs `
            --tvRoot . `
            --catalog .\docs\data\iphone-vod-catalog.json `
            --report .\docs\data\iphone-vod-catalog-report.json `
            --detailRoot .\docs\data\vod-detail `
            --indexRoot .\docs\data\vod-index `
            --dropEmptySources true
          node .\tools\apply-vod-kind-rules.mjs --tvRoot .
          node .\tools\compact-iphone-catalog.mjs `
            --tvRoot . `
            --catalog .\docs\data\iphone-vod-catalog.json `
            --report .\docs\data\iphone-vod-catalog-report.json `
            --detailRoot .\docs\data\iphone-detail `
            --pageSize 240
          node .\tools\build-tvbox-config.mjs `
            --repoRoot . `
            --output .\sources\TVBOX
          node .\tools\check-iphone-catalog-health.mjs `
            --tvRoot . `
            --catalog .\docs\data\iphone-vod-catalog.json `
            --live .\docs\data\live-channels.json `
            --output .\docs\data\iphone-health-check-latest.json `
            --csvOutput .\docs\data\iphone-health-check-latest.csv `
            --timeoutMs 8000 `
            --concurrency 18

      - name: Mark successful update
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $statePath = ".\docs\data\lunatv-vod-update-state.json"
          $intervalDays = 1
          $scheduleHour = 2
          $timeZone = [TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")
          $nowUtc = [DateTimeOffset]::UtcNow
          $localNow = [TimeZoneInfo]::ConvertTime($nowUtc, $timeZone)
          $nextLocal = $localNow.Date.AddDays($intervalDays).AddHours($scheduleHour)
          if ($nextLocal -le $localNow.DateTime) { $nextLocal = $nextLocal.AddDays(1) }
          $nextDue = [DateTimeOffset]::new($nextLocal, $timeZone.GetUtcOffset($nextLocal))
          $state = [ordered]@{
            status = "success"
            lastSuccessAt = $nowUtc.ToString("o")
            nextDueAt = $nextDue.ToString("o")
            intervalDays = $intervalDays
            scheduleHour = $scheduleHour
            timeZone = "Asia/Shanghai"
            updatedBy = "github-actions"
            runId = "${{ github.run_id }}"
          }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $statePath) | Out-Null
          Set-Content -LiteralPath $statePath -Value (($state | ConvertTo-Json -Depth 4) + "`n") -Encoding UTF8
          Write-Host "Next VOD update: $($nextDue.ToString("yyyy-MM-dd HH:mm:ss zzz"))"

      - name: Commit changes
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          $paths = @(
            "sources/current-sources.json",
            "sources/TVBOX",
            "sources/All on-demand sources",
            "sources/All on-demand sources-report.json",
            "sources/vod-lunatv-jin18-oktv.json",
            "sources/vod-lunatv-jin18-report.json",
            "sources/vod-lunatv-jin18-analysis.csv",
            "sources/vod-lunatv-full-oktv.json",
            "sources/vod-lunatv-full-report.json",
            "sources/vod-lunatv-full-analysis.csv",
            "sources/vod-lunatv-adult18-sorted-oktv.json",
            "sources/vod-lunatv-adult18-sorted-report.json",
            "sources/vod-lunatv-adult18-sorted-analysis.csv",
            "docs/data/vod-sources.json",
            "docs/data/source-summary.json",
            "docs/data/iphone-vod-catalog.json",
            "docs/data/iphone-vod-catalog-report.json",
            "docs/data/iphone-health-check-latest.json",
            "docs/data/iphone-health-check-latest.csv",
            "docs/data/lunatv-vod-update-state.json",
            "docs/iphone/index.html",
            "tools/vod-kind-rules.mjs",
            "tools/apply-vod-kind-rules.mjs",
            "tools/build-iphone-vod-catalog.mjs",
            "tools/build-full-vod-chunked-catalog.mjs",
            "tools/build-type3-spider-catalog.mjs",
            "tools/assemble-vod-index-from-detail.mjs",
            "tools/compact-iphone-catalog.mjs",
            "tools/build-tvbox-config.mjs",
            "tools/build-tvbox-api-history.mjs",
            "tools/build-quantum-lzi-full.mjs",
            "tools/update-lunatv-vod-local.ps1",
            "docs/assets/source-signal-icon.svg",
            "docs/assets/adult-18-badge.svg"
          )
          $existingPaths = @($paths | Where-Object { Test-Path -LiteralPath $_ })
          $missingPaths = @($paths | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missingPaths.Count -gt 0) {
            Write-Host "Skipping missing paths: $($missingPaths -join ', ')"
          }
          git add -- $existingPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git diff --cached --quiet) {
            Write-Host "No LunaTV VOD source changes."
          } else {
            git commit -m "Auto refresh LunaTV VOD sources"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $pushed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              git push
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }
              Write-Warning "git push failed on attempt $attempt; retrying after backoff."
              Start-Sleep -Seconds (30 * $attempt)
            }
            if (-not $pushed) {
              throw "git push failed after 3 attempts."
            }
          }

      - name: Publish GitHub Pages data
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          git fetch origin gh-pages
          $pages = Join-Path $env:RUNNER_TEMP "gh-pages"
          git worktree add $pages origin/gh-pages
          New-Item -ItemType Directory -Force -Path (Join-Path $pages "docs") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $pages "docs\data") | Out-Null
          Write-Host "Preserving existing public vod-detail/vod-index data; this run only adds or refreshes changed data."
          Copy-Item -Path .\docs\iphone -Destination (Join-Path $pages "docs") -Recurse -Force
          Copy-Item -Path .\docs\assets -Destination (Join-Path $pages "docs") -Recurse -Force
          Get-ChildItem -Path .\docs\data -File | Where-Object {
            $_.Name -notin @("iphone-vod-catalog.json", "iphone-vod-catalog-report.json")
          } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination (Join-Path $pages "docs\data") -Force
          }
          if (Test-Path -Path .\docs\data\iphone-detail) {
            Copy-Item -Path .\docs\data\iphone-detail -Destination (Join-Path $pages "docs\data") -Recurse -Force
          }
          Write-Host "Publishing indexed vod-detail/vod-index for iPhone lazy loading."
          node .\tools\build-pages-public-catalog.mjs `
            --tvRoot . `
            --pagesRoot $pages `
            --catalog .\docs\data\iphone-vod-catalog.json `
            --smallCatalog (Join-Path $pages "docs\data\iphone-vod-catalog.json") `
            --output (Join-Path $pages "docs\data\iphone-vod-catalog.json") `
            --reportOutput (Join-Path $pages "docs\data\iphone-vod-catalog-report.json") `
            --preservePreviousPublicSources true
          Push-Location $pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          git add docs/iphone docs/data docs/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git diff --cached --quiet) {
            Write-Host "No GitHub Pages public data changes."
          } else {
            git commit -m "Publish auto refreshed OKTV data"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $pushed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              git push origin HEAD:gh-pages
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                break
              }
              Write-Warning "gh-pages push failed on attempt $attempt; retrying after backoff."
              Start-Sleep -Seconds (30 * $attempt)
            }
            if (-not $pushed) {
              throw "gh-pages push failed after 3 attempts."
            }
          }
